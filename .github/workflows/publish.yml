name: Publish

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 发布渠道
        type: choice
        required: true
        default: dev
        options: [dev, beta, release]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: 计算渠道与标签
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.compute.outputs.channel }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      buildRef: ${{ steps.compute.outputs.buildRef }}
      rolling: ${{ steps.compute.outputs.rolling }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      title: ${{ steps.compute.outputs.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: compute
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          TAGS=$(git tag --list 'v*-beta.*' | tr '\n' ',')
          node tools/release/plan.mjs \
            --ref="$GITHUB_REF" \
            --event="$GITHUB_EVENT_NAME" \
            --run="$GITHUB_RUN_NUMBER" \
            --channel="$INPUT_CHANNEL" \
            --existing-tags="$TAGS" \
            --github-output >> "$GITHUB_OUTPUT"
      - name: 渠道摘要
        run: |
          echo "渠道 ${{ steps.compute.outputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "标签 ${{ steps.compute.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "构建自 ${{ steps.compute.outputs.buildRef }}" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows 安装包
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.buildRef }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 打包
        run: pnpm -C apps/desktop exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: plan
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.buildRef }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/mobile exec cap sync android
      - name: 写入签名材料
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.key"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"
      - name: 打包正式签名版
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: 打包 debug 版（未配置签名时降级）
        if: env.KEYSTORE_BASE64 == ''
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  web:
    name: Web 静态包
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.buildRef }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist/**
          if-no-files-found: error

  publish:
    name: 发布
    needs: [plan, windows, android, web]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      ROLLING: ${{ needs.plan.outputs.rolling }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      TITLE: ${{ needs.plan.outputs.title }}
      BUILD_REF: ${{ needs.plan.outputs.buildRef }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 重命名并生成校验和
        run: |
          set -euo pipefail
          mkdir -p out
          SUFFIX="${VERSION}-${CHANNEL}"

          setup=$(find artifacts/windows -name '*.exe' | head -n 1)
          cp "$setup" "out/晓刻-${SUFFIX}-windows-x64-setup.exe"

          apk=$(find artifacts/android -name '*.apk' | head -n 1)
          cp "$apk" "out/晓刻-${SUFFIX}-android.apk"

          (cd artifacts/web && zip -qr "$GITHUB_WORKSPACE/out/晓刻-${SUFFIX}-web.zip" .)

          cd out
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: 滚动渠道先删除旧发布
        if: env.ROLLING == 'true'
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: 发布或更新
        run: |
          set -euo pipefail
          TARGET=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${BUILD_REF}" | cut -f1)
          if [[ -z "$TARGET" ]]; then TARGET="$GITHUB_SHA"; fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "标签 $TAG 已存在，覆盖产物"
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "$TITLE" --prerelease=$PRERELEASE
          else
            echo "创建标签 $TAG 并发布"
            gh release create "$TAG" out/* \
              --title "$TITLE" \
              --target "$TARGET" \
              --generate-notes \
              --prerelease=$PRERELEASE
          fi
