name: Publish

on:
  push:
    branches: [main, beta, dev]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 发布渠道
        type: choice
        required: true
        default: dev
        options: [dev, beta, release]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: 计算渠道与版本
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.compute.outputs.channel }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      title: ${{ steps.compute.outputs.title }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: compute
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: node tools/release/plan.mjs --ref="$GITHUB_REF" --run="$GITHUB_RUN_NUMBER" --channel="$INPUT_CHANNEL" --github-output >> "$GITHUB_OUTPUT"

  windows:
    name: Windows 安装包
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: 打包
        run: pnpm -C apps/desktop exec tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: plan
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/mobile exec cap sync android
      - name: 写入签名材料
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 打包正式签名版
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: 打包 debug 版（未配置签名时降级）
        if: env.KEYSTORE_BASE64 == ''
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  web:
    name: Web 静态包
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist/**
          if-no-files-found: error

  publish:
    name: 发布
    needs: [plan, windows, android, web]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
      TITLE: ${{ needs.plan.outputs.title }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 重命名并生成校验和
        run: |
          set -euo pipefail
          mkdir -p out
          SUFFIX="$VERSION-$CHANNEL"

          setup=$(find artifacts/windows -name '*.exe' | head -n 1)
          cp "$setup" "out/晓刻-${SUFFIX}-windows-x64-setup.exe"

          apk=$(find artifacts/android -name '*.apk' | head -n 1)
          cp "$apk" "out/晓刻-${SUFFIX}-android.apk"

          (cd artifacts/web && zip -qr "$GITHUB_WORKSPACE/out/晓刻-${SUFFIX}-web.zip" .)

          cd out
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: 清理旧的本渠道预发布
        if: env.PRERELEASE == 'true'
        run: |
          set -euo pipefail
          keep=1
          if [[ "$CHANNEL" == beta ]]; then keep=5; fi
          mapfile -t old < <(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- "-${CHANNEL}\." | grep -v "^${TAG}$" | tail -n +$((keep + 1)) || true)
          for tag in "${old[@]}"; do
            [[ -z "$tag" ]] && continue
            echo "删除旧预发布 $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: 发布或更新
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "标签 $TAG 已存在，覆盖产物"
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "$TITLE" --prerelease=$PRERELEASE
          else
            echo "创建标签 $TAG 并发布"
            gh release create "$TAG" out/* \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --prerelease=$PRERELEASE
          fi
