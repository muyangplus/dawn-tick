name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# PR 上新推送取消旧运行；分支与标签的每个提交都要跑完（发布闸门按提交等 CI）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: 测试与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 版本号一致性
        run: node tools/release/version.mjs --check
      - run: pnpm typecheck
      - name: 单元与集成测试
        env:
          # 产品面向中国时区：测试里有用例按本地时区推算日期，runner 默认 UTC 会漂
          TZ: Asia/Shanghai
        run: pnpm test
      - name: 界面冒烟
        env:
          # 冒烟固定在产品主时区：runner 默认 UTC 会让「首次启动按系统时区对齐」把设置改成 UTC，时间文案全飘
          TZ: Asia/Shanghai
        run: pnpm ui:smoke
      - name: 静态检查（可访问性、桌面挂件契约、日志范围、更新日志结构）
        run: |
          node tools/design/check-a11y.mjs
          node tools/verify/check-widget-contract.mjs
          node tools/verify/check-log-scopes.mjs
          node tools/release/changelog.mjs --check

  timezones:
    name: 时区矩阵（${{ matrix.tz }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 半小时偏移与负偏移 + 夏令时；主时区 Asia/Shanghai 由 node job 覆盖
        tz: [Asia/Kolkata, America/New_York]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 单元与集成测试
        env:
          TZ: ${{ matrix.tz }}
        run: pnpm test

  schema:
    name: 数据模型跨引擎校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tools/schema-check/validate_schema.py
      - name: 工作流约束
        run: |
          pip install --quiet pyyaml
          python tools/verify/check-workflows.py

  rust:
    name: Rust 壳与 DDL 校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  rust-linux:
    name: Rust 壳单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 安装 WebKitGTK 等系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # 许可证清单要读 node_modules 与 cargo 注册表（含仅 Windows 的 crate），放在这里一起校验
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 第三方许可证声明与依赖一致
        run: |
          cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml
          node tools/legal/collect-licenses.mjs --check

  android:
    name: Android 编译校验
    runs-on: ubuntu-latest
    # 编译失败时要推 ci-debug 分支写日志，单独给这个 job 写权限（其余 job 仍然只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/mobile exec cap sync android
      - name: 编译 debug APK（不发版，只验证安卓工程可编译）
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          # 编译失败时把日志推到 ci-debug 分支：Actions 日志需要仓库权限，公开仓库匿名读不到
          if ! sh ./gradlew assembleDebug --no-daemon 2>&1 | tee "$LOG"; then
            mkdir -p ci-debug
            # 用 .txt 而不是 .log：仓库 .gitignore 忽略 *.log，日志文件会进不了提交
            cp "$LOG" ci-debug/android-build.txt
            git checkout -B ci-debug
            git add -f ci-debug
            git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
              commit -m "ci: 安卓编译失败日志（自动化提交，仅 ci-debug 分支）" || true
            git push -f origin HEAD:refs/heads/ci-debug || true
            exit 1
          fi
