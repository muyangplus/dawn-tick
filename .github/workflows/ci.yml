name: CI

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: 测试与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 版本号一致性
        run: node tools/release/version.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - name: 界面冒烟
        env:
          # 冒烟固定在产品主时区：runner 默认 UTC 会让「首次启动按系统时区对齐」把设置改成 UTC，时间文案全飘
          TZ: Asia/Shanghai
        run: pnpm ui:smoke

  schema:
    name: 数据模型跨引擎校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tools/schema-check/validate_schema.py

  rust:
    name: Rust 壳与 DDL 校验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  android:
    name: Android 编译校验
    runs-on: ubuntu-latest
    # 编译失败时要推 ci-debug 分支写日志，单独给这个 job 写权限（其余 job 仍然只读）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web build
      - run: pnpm -C apps/mobile exec cap sync android
      - name: 编译 debug APK（不发版，只验证安卓工程可编译）
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/android-build.log"
          # 编译失败时把日志推到 ci-debug 分支：Actions 日志需要仓库权限，公开仓库匿名读不到
          if ! sh ./gradlew assembleDebug --no-daemon 2>&1 | tee "$LOG"; then
            mkdir -p ci-debug
            cp "$LOG" ci-debug/android-build.log
            git checkout -B ci-debug
            git add -A ci-debug
            git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
              commit -m "ci: 安卓编译失败日志（自动化提交，仅 ci-debug 分支）" || true
            git push -f origin HEAD:refs/heads/ci-debug || true
            exit 1
          fi
