[package]
name = "dawn-tick-desktop"
version = "0.6.0"
edition = "2021"
publish = false

[lib]
name = "dawn_tick_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
# 关掉默认特性里的 cookies：插件的 cookie 存储要在 %LOCALAPPDATA% 下建目录并开文件，
# 权限稍有问题就会以「拒绝访问」让整个应用起不来；WebDAV 用 Basic 认证，不需要 cookie。
tauri-plugin-http = { version = "2", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "system-proxy",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# MSVC 14.51 编译 libsqlite3-sys 的 C 源码时，/Z7 会触发 cl.exe D8050。
[profile.dev]
debug = 0

[profile.test]
debug = 0
