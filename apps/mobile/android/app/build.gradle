apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 签名材料只从环境变量读取，不入库：ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
// 本地也可放属性文件（都已 gitignore）：
//   apps/mobile/android/keystore.properties
//   <仓库根>/keys/keystore.properties
// 键名两种写法都认：storeFile/storePassword/keyAlias/keyPassword 或 ANDROID_KEYSTORE_PATH/... 
def keystoreProps = new Properties()
for (String candidate : ['keystore.properties', '../../../../keys/keystore.properties']) {
    def propsFile = rootProject.file(candidate)
    if (propsFile.exists()) {
        propsFile.withInputStream { keystoreProps.load(it) }
    }
}
def signingValue = { String... names ->
    for (String name : names) {
        def fromEnv = System.getenv(name)
        if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    }
    for (String name : names) {
        def fromProps = keystoreProps.getProperty(name)
        if (fromProps != null && !fromProps.trim().isEmpty()) return fromProps.trim()
    }
    return null
}
def keystorePath = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def keystorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def keystoreAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def keystoreKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def keystoreFile = keystorePath == null ? null : (file(keystorePath).isAbsolute() ? file(keystorePath) : rootProject.file(keystorePath))
def hasReleaseKeystore = keystoreFile != null && keystoreFile.exists() && keystorePassword != null && keystoreAlias != null

android {
    namespace = "com.dawntick.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dawntick.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 602
        versionName "0.6.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 构建时可用环境变量覆盖：dev 渠道带构建时间戳与单调递增的 versionCode
    def dtVersion = System.getenv('DT_VERSION')
    if (dtVersion != null && !dtVersion.trim().isEmpty()) {
        defaultConfig.versionName = dtVersion.trim()
    }
    def dtVersionCode = System.getenv('DT_VERSION_CODE')
    if (dtVersionCode != null && !dtVersionCode.trim().isEmpty()) {
        defaultConfig.versionCode = dtVersionCode.trim().toInteger()
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword == null ? keystorePassword : keystoreKeyPassword
            }
        }
    }
    buildTypes {
        // dev 用 assembleDebug：有正式密钥材料时同样用这套签名，保证覆盖安装能正常更新
        debug {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
